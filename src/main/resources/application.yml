server:
  port: 8181
  servlet:
    context-path: /api
  shutdown: graceful
http2:
  port: 8182
http3:
  port: 8183

spring:
  profiles:
    active: ${APP_PROFILE:dev}
#  webflux:
#    base-path: /api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:h2:mem:sonartestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;IFEXISTS=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password12@}
  #    hikari:
  #      connection-timeout: 20000
  #      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        naming_strategy: org.hibernate.cfg.ImprovedNamingStrategy
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false


security:
  password:
    algorithm: HmacSHA512
    key: EPAM