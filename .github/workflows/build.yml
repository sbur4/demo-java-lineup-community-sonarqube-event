name: Java CI with Gradle

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ master ]

jobs:
  build:
    permissions:
      checks: write
      pull-requests: write
      contents: read
    environment: CIRelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
        # Automatically validates the Gradle Wrapper checksum for security
#        wrapper-validation-enabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        # This will run your H2 repository tests and any concurrency tests
        run: ./gradlew build

      - name: Upload Build Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lineup-demo-app
          path: build/libs/*.jar